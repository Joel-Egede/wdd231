<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="630" fill="#F5F7FA"/>

    <!-- Top header -->
    <rect width="1200" height="150" fill="#003366"/>

    <!-- Decorative gold line -->
    <rect y="150" width="1200" height="10" fill="#D4A017"/>

    <!-- Logo circle -->
    <circle cx="150" cy="315" r="105" fill="#003366" stroke="#D4A017" stroke-width="8"/>

    <!-- Simple building/chamber symbol -->
    <path
        d="M90 350 L150 270 L210 350"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="12"
        stroke-linejoin="round"
    />

    <line x1="105" y1="350" x2="195" y2="350"
        stroke="#FFFFFF" stroke-width="12"/>

    <line x1="120" y1="350" x2="120" y2="395"
        stroke="#FFFFFF" stroke-width="10"/>

    <line x1="150" y1="350" x2="150" y2="395"
        stroke="#FFFFFF" stroke-width="10"/>

    <line x1="180" y1="350" x2="180" y2="395"
        stroke="#FFFFFF" stroke-width="10"/>

    <line x1="100" y1="400" x2="200" y2="400"
        stroke="#D4A017" stroke-width="10"/>

    <!-- Main title -->
    <text
        x="300"
        y="255"
        font-family="Arial, Helvetica, sans-serif"
        font-size="64"
        font-weight="700"
        fill="#003366">
        Lagos Chamber
    </text>

    <text
        x="300"
        y="325"
        font-family="Arial, Helvetica, sans-serif"
        font-size="48"
        font-weight="600"
        fill="#1F2933">
        of Commerce
    </text>

    <!-- Tagline -->
    <text
        x="300"
        y="385"
        font-family="Arial, Helvetica, sans-serif"
        font-size="30"
        fill="#1F2933">
        Connecting Businesses • Creating Opportunities
    </text>

    <!-- Bottom information -->
    <rect x="0" y="520" width="1200" height="110" fill="#003366"/>

    <text
        x="600"
        y="585"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="32"
        font-weight="600"
        fill="#FFFFFF">
        Lagos, Nigeria
    </text>

    <!-- Gold accent -->
    <circle cx="1080" cy="80" r="35" fill="#D4A017"/>
    <circle cx="1135" cy="80" r="18" fill="#FFFFFF"/>
</svg>
