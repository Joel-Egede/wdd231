<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 200"
     width="200"
     height="200"
     role="img"
     aria-labelledby="title desc">

    <title id="title">Lagos Chamber of Commerce Logo</title>
    <desc id="desc">
        A blue and gold chamber building symbol representing the Lagos Chamber of Commerce.
    </desc>

    <!-- Background -->
    <circle
        cx="100"
        cy="100"
        r="94"
        fill="#003366"
        stroke="#D4A017"
        stroke-width="8"
    />

    <!-- Building roof -->
    <path
        d="M45 82 L100 38 L155 82 Z"
        fill="#D4A017"
    />

    <!-- Building top -->
    <rect
        x="58"
        y="78"
        width="84"
        height="12"
        fill="#FFFFFF"
    />

    <!-- Columns -->
    <rect
        x="64"
        y="90"
        width="14"
        height="55"
        fill="#FFFFFF"
    />

    <rect
        x="93"
        y="90"
        width="14"
        height="55"
        fill="#FFFFFF"
    />

    <rect
        x="122"
        y="90"
        width="14"
        height="55"
        fill="#FFFFFF"
    />

    <!-- Building base -->
    <rect
        x="48"
        y="145"
        width="104"
        height="12"
        fill="#D4A017"
    />

    <rect
        x="40"
        y="157"
        width="120"
        height="10"
        fill="#FFFFFF"
    />

    <!-- Small decorative stars -->
    <circle
        cx="38"
        cy="105"
        r="4"
        fill="#D4A017"
    />

    <circle
        cx="162"
        cy="105"
        r="4"
        fill="#D4A017"
    />

</svg>
